<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow - Home</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <img src="logo.png" class="logo" alt="TaskFlow Logo">
            <h1>TaskFlow</h1>
            <p class="subtitle">Stay Organized. Stay Productive.</p>
            <p id="currentDate"></p>
        </header>
        <nav>
            <a href="index.html" class="active">Home</a>
            <a href="about.html">About</a>
        </nav>
        <div class="input-section">
            <input type="text" id="taskInput" placeholder="Enter a new task...">
            <button id="addBtn">Add Task</button>
        </div>
        <div class="task-info">
            <p id="taskStats">Pending: 0 | Completed: 0</p>
            <button id="clearBtn">Clear All</button>
        </div>
        <input type="text" id="searchInput" placeholder="Search tasks...">
        <section class="tasks-section">
            <h2>Pending Tasks</h2>
            <ul id="pendingList"></ul>
            <h2>Completed Tasks</h2>
            <ul id="completedList"></ul>
            <p id="emptyMsg">No tasks yet. Add your first task!</p>
        </section>
        <footer>
            <p>&copy; 2026 TaskFlow</p>
        </footer>
    </div>
    <script src="script.js"></script>
</body>
</html>
